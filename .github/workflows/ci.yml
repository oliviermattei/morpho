name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. new push to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck · lint · unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run check` = tsc --noEmit + eslint + vitest run.
      # The unit suite runs against PGlite (ADR 009), so no live database
      # is needed here. E2E is deliberately not in CI: it requires a real
      # Neon Auth project and credentials.
      - name: Check
        run: npm run check

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Placeholders: `next build` only needs these to exist, and nothing
      # in the build path opens a connection or calls the auth server.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgres://user:password@localhost:5432/morpho
          NEON_AUTH_BASE_URL: https://example.invalid
          NEON_AUTH_COOKIE_SECRET: ci-placeholder-secret-value-32chars
